<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E40AF"/>
      <stop offset="100%" style="stop-color:#1D4ED8"/>
    </linearGradient>
    <linearGradient id="arc1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#93C5FD"/>
      <stop offset="100%" style="stop-color:#60A5FA"/>
    </linearGradient>
    <linearGradient id="arc2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#BFDBFE"/>
      <stop offset="100%" style="stop-color:#93C5FD"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="128" height="128" rx="24" fill="url(#bg)"/>
  <!-- Outer rotating arc: Planning phase -->
  <path d="M64 22 A42 42 0 0 1 106 64" fill="none" stroke="url(#arc2)" stroke-width="6" stroke-linecap="round" opacity="0.6"/>
  <path d="M106 64 A42 42 0 0 1 64 106" fill="none" stroke="url(#arc1)" stroke-width="6" stroke-linecap="round" opacity="0.8"/>
  <!-- Inner rotating arc: Execution phase -->
  <path d="M64 34 A30 30 0 0 1 94 64" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.9"/>
  <path d="M94 64 A30 30 0 0 1 64 94" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
  <!-- Center: AI spark / transition point -->
  <circle cx="64" cy="64" r="14" fill="#FFFFFF" opacity="0.95"/>
  <circle cx="64" cy="64" r="8" fill="#3B82F6"/>
  <!-- Transition arrow: Planning → Execution -->
  <path d="M56 64 L68 56 L68 60 L76 60 L76 68 L68 68 L68 72 Z" fill="#FFFFFF" opacity="0"/>
  <!-- AI sparkle dots -->
  <circle cx="40" cy="38" r="2.5" fill="#E0E7FF" opacity="0.8"/>
  <circle cx="92" cy="36" r="2" fill="#E0E7FF" opacity="0.6"/>
  <circle cx="36" cy="90" r="2" fill="#E0E7FF" opacity="0.5"/>
  <circle cx="94" cy="92" r="2.5" fill="#E0E7FF" opacity="0.7"/>
</svg>
